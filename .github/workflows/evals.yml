name: Evals

# Evaluation tests make real LLM calls and cost money per run.  They
# are NOT part of the default CI; trigger them manually or on a
# schedule.

on:
  workflow_dispatch:
    inputs:
      case_filter:
        description: "pytest -k filter (optional)"
        required: false
        default: ""
  schedule:
    # Weekly, Monday 09:00 UTC.
    - cron: "0 9 * * 1"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        # `uv sync --locked` honors uv.lock; `uv pip` does NOT, which
        # is how we previously ended up with stale transitive deps.
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --extra dev --locked

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILTER="${{ github.event.inputs.case_filter }}"
          COMMON_ARGS=(-v --tb=short --junit-xml=evals-results.xml --output-dir=./eval-artifacts)
          if [ -n "$FILTER" ]; then
            uv run pytest evals/cases/ "${COMMON_ARGS[@]}" -k "$FILTER"
          else
            uv run pytest evals/cases/ "${COMMON_ARGS[@]}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evals-results
          path: |
            evals-results.xml
            eval-artifacts/
